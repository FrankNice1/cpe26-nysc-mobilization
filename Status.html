<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
CPE '26 | Check Mobilization Status
</title>


<style>

@import url(
'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap'
);


* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family: Inter, Arial, sans-serif;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,229,255,.12),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(0,100,255,.12),
            transparent 25%
        ),
        #050b14;

    color: #eaf7ff;

    padding: 20px;

}


body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .12;

    background-image:
        linear-gradient(
            rgba(0,229,255,.3) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,229,255,.3) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

}


.container {

    max-width: 650px;

    margin: auto;

    position: relative;

}


.header {

    text-align: center;

    padding: 45px 10px 30px;

}


.logo {

    font-family:
        "Space Mono",
        monospace;

    color: #00e5ff;

    font-size: 14px;

    letter-spacing: 3px;

    margin-bottom: 15px;

}


h1 {

    font-size:
        clamp(
            28px,
            6vw,
            42px
        );

    font-weight: 800;

}


h1 span {

    color: #00e5ff;

}


.header p {

    color: #91a7b8;

    font-size: 13px;

    margin-top: 10px;

}


.card {

    background:
        rgba(
            9,
            20,
            34,
            .9
        );

    border:
        1px solid
        rgba(
            0,
            229,
            255,
            .18
        );

    border-radius: 20px;

    padding: 30px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.35);

}


label {

    display: block;

    color: #b9cbd6;

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 8px;

}


input {

    width: 100%;

    padding: 15px;

    background: #07111d;

    color: white;

    border:
        1px solid
        #263c4d;

    border-radius: 10px;

    outline: none;

    font-size: 15px;

    font-family:
        "Space Mono",
        monospace;

    text-transform: uppercase;

}


input:focus {

    border-color:
        #00e5ff;

    box-shadow:
        0 0 0 3px
        rgba(
            0,
            229,
            255,
            .08
        );

}


button {

    width: 100%;

    border: none;

    margin-top: 15px;

    padding: 16px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #00bcd4,
            #007bff
        );

    color: white;

    font-weight: 800;

    cursor: pointer;

}


button:disabled {

    opacity: .5;

}


.result {

    display: none;

    margin-top: 25px;

}


.status-box {

    padding: 20px;

    border-radius: 12px;

    margin-bottom: 15px;

    text-align: center;

}


.pending {

    background:
        rgba(
            234,
            179,
            8,
            .08
        );

    border:
        1px solid
        rgba(
            234,
            179,
            8,
            .3
        );

}


.approved {

    background:
        rgba(
            34,
            197,
            94,
            .08
        );

    border:
        1px solid
        rgba(
            34,
            197,
            94,
            .3
        );

}


.rejected {

    background:
        rgba(
            239,
            68,
            68,
            .08
        );

    border:
        1px solid
        rgba(
            239,
            68,
            68,
            .3
        );

}


.status-icon {

    font-size: 38px;

    margin-bottom: 8px;

}


.status-title {

    font-size: 22px;

    font-weight: 800;

}


.info {

    background:
        rgba(
            255,
            255,
            255,
            .03
        );

    border-radius: 12px;

    padding: 18px;

    line-height: 1.8;

    font-size: 14px;

}


.info strong {

    color: #00e5ff;

}


.reasons {

    margin-top: 15px;

}


.reason {

    padding: 10px;

    margin-top: 7px;

    border-radius: 7px;

    background:
        rgba(
            239,
            68,
            68,
            .08
        );

    color: #fca5a5;

}


.comment {

    margin-top: 15px;

    padding: 15px;

    border-left:
        3px solid
        #00e5ff;

    background:
        rgba(
            0,
            229,
            255,
            .05
        );

    color: #b9cbd6;

}


.resubmit {

    display: block;

    text-align: center;

    margin-top: 20px;

    padding: 14px;

    border-radius: 9px;

    background:
        linear-gradient(
            90deg,
            #00bcd4,
            #007bff
        );

    color: white;

    text-decoration: none;

    font-weight: 800;

}


.error {

    display: none;

    margin-top: 20px;

    padding: 15px;

    border-radius: 10px;

    background:
        rgba(
            239,
            68,
            68,
            .08
        );

    border:
        1px solid
        rgba(
            239,
            68,
            68,
            .3
        );

    color: #fca5a5;

}


.back {

    text-align: center;

    margin-top: 20px;

}


.back a {

    color: #00e5ff;

    text-decoration: none;

    font-size: 13px;

}


.footer {

    text-align: center;

    color: #637887;

    font-size: 11px;

    padding: 25px;

}


</style>

</head>


<body>


<div class="container">


<header class="header">

<div class="logo">
&lt; CPE_26 /&gt;
</div>

<h1>
CHECK <span>STATUS</span>
</h1>

<p>
NYSC MOBILIZATION • COMPUTER ENGINEERING CLASS OF 2026
</p>

</header>



<div class="card">


<label>
Submission ID
</label>


<input
id="submissionID"
placeholder="CPE26-NYSC-0001"
autocomplete="off"
>


<button
id="checkButton"
onclick="checkStatus()"
>

CHECK MOBILIZATION STATUS →

</button>


<div
id="error"
class="error"
></div>



<div
id="result"
class="result"
>

<div
id="statusBox"
class="status-box"
>

<div
id="statusIcon"
class="status-icon"
>
</div>

<div
id="statusTitle"
class="status-title"
>
</div>

</div>


<div
id="info"
class="info"
>
</div>

</div>


<div class="back">

<a href="index.html">
← Return to Mobilization Form
</a>

</div>


</div>


<footer class="footer">

CPE '26 • COMPUTER ENGINEERING • NYSC MOBILIZATION

</footer>


</div>



<script>


const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyu5ZMcfGyWk7tXGthr6J9B88HV9G3jGGr3hPCtty4grDXQ86BiYETLXDcJ3JZxUOGg/exec";



async function checkStatus() {


const id =
document
.getElementById(
"submissionID"
)
.value
.trim();



if (!id) {

showError(
"Please enter your Submission ID."
);

return;

}



const button =
document
.getElementById(
"checkButton"
);


button.disabled =
true;

button.innerText =
"CHECKING...";



hideError();


document
.getElementById(
"result"
)
.style
.display =
"none";



try {


const response =
await fetch(

GOOGLE_SCRIPT_URL +
"?action=status&id=" +
encodeURIComponent(id)

);



const data =
await response.json();



if (!data.success) {

throw new Error(
data.message
);

}



showResult(data);



}

catch(error) {

showError(
error.message
);

}



button.disabled =
false;

button.innerText =
"CHECK MOBILIZATION STATUS →";

}



function showResult(data) {


const result =
document
.getElementById(
"result"
);


const box =
document
.getElementById(
"statusBox"
);


const icon =
document
.getElementById(
"statusIcon"
);


const title =
document
.getElementById(
"statusTitle"
);


const info =
document
.getElementById(
"info"
);



result.style.display =
"block";



box.className =
"status-box";



const status =
data.status
.toLowerCase();



if (
status === "approved"
) {


box.classList.add(
"approved"
);


icon.innerText =
"✓";


title.innerText =
"MOBILIZATION APPROVED";


}


else if (
status === "rejected"
) {


box.classList.add(
"rejected"
);


icon.innerText =
"×";


title.innerText =
"CORRECTION REQUIRED";


}


else {


box.classList.add(
"pending"
);


icon.innerText =
"⌛";


title.innerText =
"PENDING REVIEW";

}



let html =

"<strong>Submission ID:</strong> " +
escapeHTML(
data.submissionID
) +

"<br>" +

"<strong>Name:</strong> " +
escapeHTML(
data.name
) +

"<br>" +

"<strong>Matric No:</strong> " +
escapeHTML(
data.matricNo
);



if (
data.reviewDate
) {

html +=

"<br>" +

"<strong>Reviewed:</strong> " +
escapeHTML(
data.reviewDate
);

}



if (
status === "rejected" &&
data.rejectionReason
) {


const reasons =
data.rejectionReason
.split(";");



html +=

'<div class="reasons">' +

"<strong>Issues identified:</strong>";



reasons.forEach(
function(reason) {

html +=

'<div class="reason">❌ ' +

escapeHTML(
reason.trim()
) +

"</div>";

});



html +=
"</div>";

}



if (
data.adminComment
) {


html +=

'<div class="comment">' +

"<strong>Administrator's comment:</strong><br>" +

escapeHTML(
data.adminComment
) +

"</div>";

}



if (
status === "rejected"
) {


html +=

'<a class="resubmit" href="index.html">' +

"CORRECT & RESUBMIT →" +

"</a>";

}



info.innerHTML =
html;

}



function showError(message) {

const error =
document
.getElementById(
"error"
);


error.innerText =
message;


error.style.display =
"block";

}



function hideError() {

document
.getElementById(
"error"
)
.style
.display =
"none";

}



function escapeHTML(value) {

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


</script>


</body>

</html>
