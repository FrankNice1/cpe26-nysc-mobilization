<!DOCTYPE html><html lang="en">

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

body{

background:
radial-gradient(circle at 20% 20%,rgba(0,229,255,.12),transparent 25%),
radial-gradient(circle at 80% 80%,rgba(0,100,255,.12),transparent 25%),

}

content:"";

pointer-events:none;

linear-gradient(rgba(0,229,255,.3) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,229,255,.3) 1px,transparent 1px);

}

.header{text-align:center;padding:45px 10px 30px}

.logo{
font-family:"Space Mono",monospace;
color:#00e5ff;
font-size:14px;
letter-spacing:3px;

}

h1 span{color:#00e5ff}

.header p{color:#91a7b8;font-size:13px;margin-top:10px}

.card{
background:rgba(9,20,34,.9);
border:1px solid rgba(0,229,255,.18);
border-radius:20px;
padding:30px;
backdrop-filter:blur(15px);
box-shadow:0 25px 80px rgba(0,0,0,.35)
}

label{
display:block;
color:#b9cbd6;
font-size:12px;
font-weight:700;
margin-bottom:8px
}

input{
width:100%;
padding:15px;
background:#07111d;
color:white;
border:1px solid #263c4d;
border-radius:10px;
outline:none;
font-size:15px;
font-family:"Space Mono",monospace;
text-transform:uppercase
}

input:focus{
border-color:#00e5ff;
box-shadow:0 0 0 3px rgba(0,229,255,.08)
}

button{
width:100%;
border:none;
margin-top:15px;
padding:16px;
border-radius:10px;
background:linear-gradient(90deg,#00bcd4,#007bff);
color:white;
font-weight:800;
cursor:pointer
}

button:disabled{opacity:.5}

.result{display:none;margin-top:25px}

.status-box{
padding:20px;
border-radius:12px;
margin-bottom:15px;
text-align:center
}

.pending{
background:rgba(234,179,8,.08);
border:1px solid rgba(234,179,8,.3)
}

.approved{
background:rgba(34,197,94,.08);
border:1px solid rgba(34,197,94,.3)
}

.rejected{
background:rgba(239,68,68,.08);
border:1px solid rgba(239,68,68,.3)
}

.status-icon{font-size:38px;margin-bottom:8px}
.status-title{font-size:22px;font-weight:800}

.info{
background:rgba(255,255,255,.03);

padding:18px;

}

.info strong{color:#00e5ff}

.reasons{margin-top:15px}

.reason{

margin-top:7px;

}

.comment{
margin-top:15px;
padding:15px;
border-left:3px solid #00e5ff;
background:rgba(0,229,255,.05);
color:#b9cbd6
}

.resubmit{
display:block;
text-align:center;
margin-top:20px;
padding:14px;
border-radius:9px;
background:linear-gradient(90deg,#00bcd4,#007bff);
color:white;

font-weight:800
}

.error{

margin-top:20px;

border:1px solid rgba(239,68,68,.3);
color:#fca5a5
}

.back{text-align:center;margin-top:20px}

.back a{
color:#00e5ff;

}

.footer{

}
</style></head><body><div class="container"><header class="header"><div class="logo">&lt; CPE_26 /&gt;</div><h1>CHECK <span>STATUS</span></h1><p>
NYSC MOBILIZATION • COMPUTER ENGINEERING CLASS OF 2026
</p><div style="margin-top:12px;">
<a href="index.html" style="color:#00e5ff;margin-right:12px;text-decoration:none;font-weight:700">Home</a>
<a href="nerd.html" style="color:#00e5ff;margin-right:12px;text-decoration:none;font-weight:700">NERD</a>
<a href="student-dataform.html" style="color:#00e5ff;font-weight:800">Student Dataform</a>
</div></header><div class="card"><label>Submission ID</label>

<input
id="submissionID"
placeholder="IT-2026-00001"
autocomplete="off"

«»

<button id="checkButton" onclick="checkStatus()">
CHECK MOBILIZATION STATUS →
</button><div id="error" class="error"></div><div id="result" class="result"><div id="statusBox" class="status-box"><div id="statusIcon" class="status-icon"></div><div id="statusTitle" class="status-title"></div></div><div id="info" class="info"></div></div><div class="back">
<a href="student-dataform.html">
← Return to Student Dataform
</a>
</div></div><footer class="footer">
CPE '26 • COMPUTER ENGINEERING • NYSC MOBILIZATION
</footer></div><script>

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyu5ZMcfGyWk7tXGthr6J9B88HV9G3jGGr3hPCtty4grDXQ86BiYETLXDcJ3JZxUOGg/exec";

async function checkStatus(){

const id=document.getElementById("submissionID").value.trim();

if(!id){
showError("Please enter your Submission ID.");
return;
}

const button=document.getElementById("checkButton");

button.disabled=true;
button.innerText="CHECKING...";

hideError();
document.getElementById("result").style.display="none";

try{

/*
 NEW IT DATAFORM STATUS ROUTE
*/
let url=
GOOGLE_SCRIPT_URL+
"?action=itStatus&id="+
encodeURIComponent(id);

let response=await fetch(url);
let data=await response.json();

/*
 If not found, also try submissionID parameter.
*/
if(!data.success){

url=
GOOGLE_SCRIPT_URL+
"?action=itStatus&submissionID="+
encodeURIComponent(id);

response=await fetch(url);
data=await response.json();

}

/*
 Only if the ID starts with NYSC,
 try the old NYSC system.
*/
if(!data.success && id.toUpperCase().startsWith("NYSC-")){

response=await fetch(
GOOGLE_SCRIPT_URL+
"?action=status&id="+
encodeURIComponent(id)
);

data=await response.json();

}

if(!data.success){

throw new Error(
data.message||"Submission not found"
);

}

showResult(data);

}catch(error){

showError(
error.message||
"Unable to check status"
);

}finally{

button.disabled=false;
button.innerText=
"CHECK MOBILIZATION STATUS →";

}

}


function showResult(data){

const result=document.getElementById("result");
const box=document.getElementById("statusBox");
const icon=document.getElementById("statusIcon");
const title=document.getElementById("statusTitle");
const info=document.getElementById("info");

result.style.display="block";

box.className="status-box";

const status=
String(data.status||"Pending").toLowerCase();

if(status==="approved"){

box.classList.add("approved");
icon.innerText="✓";
title.innerText="MOBILIZATION APPROVED";

}
else if(status==="rejected"){

box.classList.add("rejected");
icon.innerText="×";
title.innerText="CORRECTION REQUIRED";

}
else{

box.classList.add("pending");
icon.innerText="⌛";
title.innerText="PENDING REVIEW";

}


/*
 NEW IT BACKEND RETURNS:
 submissionID
 status
 rejectionReason
 adminComment
 reviewedBy
 reviewDate

*/
let html=
"<strong>Submission ID:</strong> "+
escapeHTML(data.submissionID||"")+
"<br><strong>Status:</strong> "+
escapeHTML(data.status||"Pending");


if(data.reviewDate){

html+=
"<br><strong>Reviewed:</strong> "+
escapeHTML(
formatDate(data.reviewDate)
);

}


if(data.reviewedBy){

html+=
"<br><strong>Reviewed By:</strong> "+
escapeHTML(data.reviewedBy);

}


if(
status==="rejected" &&
data.rejectionReason
){

const reasons=
String(data.rejectionReason)
.split(";");

html+=
'<div class="reasons">'+
"<strong>Issues identified:</strong>";

reasons.forEach(function(reason){

if(reason.trim()){

html+=
'<div class="reason">❌ '+
escapeHTML(reason.trim())+
"</div>";

}

});

html+="</div>";

}


if(data.adminComment){

html+=
'<div class="comment">'+
"<strong>Admin comment:</strong><br>"+
escapeHTML(data.adminComment)+
"</div>";

}


info.innerHTML=html;

}


function formatDate(value){

try{

const d=new Date(value);

if(isNaN(d.getTime()))
return value;

return d.toLocaleString();

}catch(e){

return value;

}

}


function showError(msg){

const err=document.getElementById("error");

err.style.display="block";
err.innerText=msg;

}


function hideError(){

const err=document.getElementById("error");

err.style.display="none";
err.innerText="";

}


function escapeHTML(v){

return String(v||"").replace(
/[&<>"']/g,
function(m){

return({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

})[m];

});

}

</script></body>
</html>
