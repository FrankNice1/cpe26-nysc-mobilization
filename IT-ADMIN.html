<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPE ’26 IT Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eaf2ff}header{background:#0b1d33;padding:18px;text-align:center;border-bottom:1px solid #173653}header h1{margin:0;font-size:22px;color:#35d9ff}header p{margin:6px 0 0;color:#91a9c4;font-size:13px}.box{max-width:1200px;margin:20px auto;padding:0 15px}.card{background:#0c1b2d;border:1px solid #173653;border-radius:12px;padding:18px;margin-bottom:18px}.login{max-width:400px;margin:70px auto}.input{width:100%;padding:13px;margin:7px 0;background:#07111f;border:1px solid #29445f;border-radius:7px;color:white}.btn{border:0;border-radius:7px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{background:#19c9ef;color:#00121c}.success{background:#22c55e;color:#041409}.danger{background:#ef4444;color:white}.muted{color:#8fa6bf;font-size:13px}.hide{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0c1b2d;border:1px solid #173653;border-radius:10px;padding:16px}.stat b{display:block;font-size:25px;color:#35d9ff;margin-top:5px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select{padding:11px;background:#07111f;color:white;border:1px solid #29445f;border-radius:7px}.tools input{flex:1;min-width:200px}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}th,td{padding:11px 8px;border-bottom:1px solid #18334e;text-align:left}th{color:#7edfff;background:#0a1727}tr:hover{background:#10243a}.badge{padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}.pending{background:#3b3212;color:#ffd84d}.approved{background:#123d25;color:#5dff9b}.rejected{background:#451b22;color:#ff7c8c}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}.modalbox{background:#0c1b2d;border:1px solid #29445f;border-radius:12px;width:100%;max-width:700px;max-height:90vh;overflow:auto;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#07111f;border-radius:7px;padding:10px}.field small{display:block;color:#718ba6;margin-bottom:4px}.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.msg{margin-top:10px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>

<header>
<h1>CPE ’26 — IT / SIWES ADMIN</h1>
<p id="adminInfo">Administrator Portal</p>
</header>

<div id="loginPage" class="box">
<div class="card login">
<h2>Admin Login</h2>
<p class="muted">Use your existing administrator account.</p>
<input id="username" class="input" placeholder="Username" autocomplete="username">
<input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn primary" style="width:100%" onclick="login()">LOGIN</button>
<div id="loginMsg" class="msg"></div>
</div>
</div>

<div id="adminPage" class="box hide">
<div class="card">
<div class="top">
<div><b>IT / SIWES Submissions</b><div class="muted">Review and manage student submissions</div></div>
<button class="btn primary" onclick="loadData()">↻ REFRESH</button>
</div>
</div>

<div class="stats">
<div class="stat">TOTAL<b id="total">0</b></div>
<div class="stat">PENDING<b id="pending">0</b></div>
<div class="stat">APPROVED<b id="approved">0</b></div>
<div class="stat">REJECTED<b id="rejected">0</b></div>
</div>

<div class="card">
<div class="tools">
<input id="search" placeholder="Search name, matric no., submission ID, course... " oninput="render()">
<select id="filter" onchange="render()">
<option value="">All Status</option>
<option>Pending</option>
<option>Approved</option>
<option>Rejected</option>
</select>
</div>
<table>
<thead><tr><th>#</th><th>Submission ID</th><th>Name</th><th>Matric No.</th><th>Course</th><th>Level</th><th>Employer</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<div id="tableMsg" class="msg"></div>
</div>
</div>

<div id="modal" class="modal">
<div class="modalbox">
<div class="top">
<h2 id="modalTitle">Submission</h2>
<button class="btn danger" onclick="closeModal()">✕</button>
</div>
<div id="details" class="grid"></div>
<div id="reviewArea"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyu5ZMcfGyWk7tXGthr6J9B88HV9G3jGGr3hPCtty4grDXQ86BiYETLXDcJ3JZxUOGg/exec";
let admin=null,data=[],selected=null;

async function login(){
 const u=username.value.trim(),p=password.value;
 if(!u||!p){loginMsg.textContent="Enter username and password";return}
 loginMsg.textContent="Checking access...";
 try{
  const r=await fetch(API+"?action=adminLogin&username="+encodeURIComponent(u)+"&password="+encodeURIComponent(p)+"&t="+Date.now());
  const x=await r.json();
  if(!x.success){loginMsg.textContent=x.message||"Access denied";return}
  admin=x;
  sessionStorage.setItem("itAdmin",JSON.stringify(x));
  showAdmin();
 }catch(e){loginMsg.textContent="Unable to connect to backend"}
}

function showAdmin(){
 loginPage.classList.add("hide");
 adminPage.classList.remove("hide");
 adminInfo.textContent="Logged in: "+(admin.name||admin.username)+" • "+(admin.role||"Admin");
 loadData();
}

async function loadData(){
 tableMsg.textContent="Loading submissions...";
 try{
  const r=await fetch(API+"?action=itAdminList&t="+Date.now());
  const x=await r.json();
  if(!x.success){tableMsg.textContent=x.message||"Could not load data";return}
  data=x.records||[];
  updateStats();
  render();
  tableMsg.textContent="";
 }catch(e){tableMsg.textContent="Unable to connect to backend"}
}

function updateStats(){
 total.textContent=data.length;
 pending.textContent=data.filter(r=>String(r[17]).toLowerCase()=="pending").length;
 approved.textContent=data.filter(r=>String(r[17]).toLowerCase()=="approved").length;
 rejected.textContent=data.filter(r=>String(r[17]).toLowerCase()=="rejected").length;
}

function render(){
 const q=search.value.toLowerCase(),f=filter.value;
 const list=data.map((r,i)=>({r,i})).filter(o=>{
  const r=o.r,s=String(r[17]||"");
  return(!f||s==f)&&(!q||r.join(" ").toLowerCase().includes(q));
 });
 rows.innerHTML=list.map((o,n)=>{
  const r=o.r,s=String(r[17]||"Pending");
  return `<tr><td>${o.i+1}</td><td>${esc(r[0])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[10])}</td><td><span class="badge ${s.toLowerCase()}">${esc(s)}</span></td><td><button class="btn primary" onclick="openReview(${o.i})">VIEW</button></td></tr>`;
 }).join("");
}

function openReview(i){
 selected=data[i];
 const r=selected;
 modalTitle.textContent=r[0]+" — Submission Details";
 const fields=[
 ["Submission ID",r[0]],["Timestamp",r[1]],["Name",r[2]],["Matric No.",r[3]],
 ["Course",r[4]],["Level",r[5]],["SIWES Year",r[6]],["Student Email",r[7]],
 ["Phone",r[8]],["Nationality",r[9]],["Employer Name",r[10]],["Employer Address",r[11]],
 ["From Date",r[12]],["To Date",r[13]],["Bank",r[14]],["Account Number",r[15]],
 ["Sort Code",r[16]],["Status",r[17]],["Rejection Reason",r[18]],["Admin Comment",r[19]],
 ["Reviewed By",r[20]],["Review Date",r[21]]
 ];
 details.innerHTML=fields.map(x=>`<div class="field"><small>${x[0]}</small>${esc(x[1]||"—")}</div>`).join("");
 if(String(r[17])=="Pending"){
  reviewArea.innerHTML=`<div class="actions"><button class="btn success" onclick="approve()">✓ APPROVE</button><button class="btn danger" onclick="reject()">✕ REJECT</button></div>`;
 }else{
  reviewArea.innerHTML=`<div class="muted" style="margin-top:15px">This submission has already been ${esc(r[17]).toLowerCase()}.</div>`;
 }
 modal.style.display="flex";
}

function closeModal(){modal.style.display="none"}

async function approve(){
 if(!selected)return;
 if(!confirm("Approve this submission?"))return;
 await review("itApprove",{submissionID:selected[0],reviewedBy:admin.name||admin.username});
}

async function reject(){
 if(!selected)return;
 const reason=prompt("Enter rejection reason:");
 if(!reason||!reason.trim())return;
 const comment=prompt("Admin comment (optional):")||"";
 await review("itReject",{submissionID:selected[0],rejectionReason:reason.trim(),adminComment:comment,reviewedBy:admin.name||admin.username});
}

async function review(action,payload){
 try{
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})});
  const x=await r.json();
  alert(x.message||"Completed");
  if(x.success){closeModal();loadData()}
 }catch(e){alert("Unable to connect to backend")}
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

(function(){
 try{
  const x=sessionStorage.getItem("itAdmin");
  if(x){admin=JSON.parse(x);showAdmin()}
 }catch(e){}
})();
</script>
</body>
</html>
