<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CPE '26 | Admin Console</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,229,255,.08), transparent 25%),
        #050b14;
    color: #eaf7ff;
    min-height: 100vh;
    padding: 15px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.header {
    padding: 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-family: "Space Mono", monospace;
    color: #00e5ff;
    font-size: 14px;
}

.header h1 {
    font-size: 24px;
}

.logout {
    background: transparent;
    border: 1px solid #263c4d;
    color: #9db1bf;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: #091422;
    border: 1px solid #1b3040;
    border-radius: 12px;
    padding: 18px;
}

.stat-label {
    color: #8298a7;
    font-size: 11px;
    text-transform: uppercase;
}

.stat-number {
    font-size: 28px;
    font-weight: 800;
    margin-top: 5px;
    color: #00e5ff;
}

.card {
    background: rgba(9,20,34,.92);
    border: 1px solid #1b3040;
    border-radius: 15px;
    padding: 20px;
}

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

input,
select,
textarea {
    background: #07111d;
    color: white;
    border: 1px solid #263c4d;
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #00e5ff;
}

.search {
    flex: 1;
    min-width: 220px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

th {
    text-align: left;
    color: #718795;
    font-size: 11px;
    padding: 12px;
    border-bottom: 1px solid #1b3040;
}

td {
    padding: 13px 12px;
    border-bottom: 1px solid #132535;
    font-size: 13px;
}

.status {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
}

.status.Pending {
    background: #422d05;
    color: #facc15;
}

.status.Approved {
    background: #06351d;
    color: #4ade80;
}

.status.Rejected {
    background: #400d0d;
    color: #f87171;
}

.review-btn {
    border: 1px solid #00e5ff;
    background: transparent;
    color: #00e5ff;
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    z-index: 10;
    padding: 20px;
    overflow-y: auto;
}

.modal-content {
    max-width: 750px;
    margin: 30px auto;
    background: #091422;
    border: 1px solid #263c4d;
    border-radius: 15px;
    padding: 25px;
}

.modal-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.close {
    cursor: pointer;
    color: #8298a7;
    font-size: 22px;
}

.details {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.detail {
    background: #07111d;
    padding: 12px;
    border-radius: 7px;
}

.detail small {
    display: block;
    color: #6f8796;
    font-size: 10px;
    margin-bottom: 4px;
}

.detail strong {
    font-size: 13px;
}

.reason-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 8px;
    margin: 12px 0;
}

.reason {
    background: #07111d;
    border: 1px solid #1c3444;
    border-radius: 7px;
    padding: 10px;
    font-size: 12px;
}

.reason input {
    margin-right: 7px;
}

textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
}

.action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.approve,
.reject {
    flex: 1;
    border: none;
    padding: 13px;
    border-radius: 8px;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

.approve {
    background: #16a34a;
}

.reject {
    background: #dc2626;
}

.message {
    margin: 15px 0;
    padding: 12px;
    border-radius: 8px;
    display: none;
}

.success {
    display: block;
    background: #06351d;
    color: #86efac;
}

.error {
    display: block;
    background: #400d0d;
    color: #fca5a5;
}

@media(max-width:700px) {
    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .details,
    .reason-grid {
        grid-template-columns: 1fr;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

<div>
<div class="logo">&lt; CPE_26 / ADMIN_CONSOLE &gt;</div>
<h1>NYSC Mobilization Review</h1>
</div>

<button class="logout" onclick="logout()">
LOGOUT
</button>

</header>


<div class="stats">

<div class="stat">
<div class="stat-label">Total</div>
<div id="total" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-label">Pending</div>
<div id="pending" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-label">Approved</div>
<div id="approved" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-label">Rejected</div>
<div id="rejected" class="stat-number">0</div>
</div>

</div>


<div class="card">

<div class="toolbar">

<input
id="search"
class="search"
placeholder="Search name, matric number or Submission ID..."
oninput="renderTable()"
>

<select id="filter" onchange="renderTable()">
<option value="All">All</option>
<option value="Pending">Pending</option>
<option value="Approved">Approved</option>
<option value="Rejected">Rejected</option>
</select>

</div>


<div id="message" class="message"></div>


<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Submission ID</th>
<th>Name</th>
<th>Matric No.</th>
<th>Course</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

</div>


<!-- REVIEW MODAL -->

<div id="modal" class="modal">

<div class="modal-content">

<div class="modal-title">

<h2>Review Submission</h2>

<span
class="close"
onclick="closeModal()"
>
×
</span>

</div>


<div id="details" class="details"></div>


<h3>Rejection Reason(s)</h3>

<div class="reason-grid">

<label class="reason">
<input type="checkbox" value="Matriculation number is incorrect">
Matric No. incorrect
</label>

<label class="reason">
<input type="checkbox" value="First name is incorrect">
First Name incorrect
</label>

<label class="reason">
<input type="checkbox" value="Middle name is incorrect">
Middle Name incorrect
</label>

<label class="reason">
<input type="checkbox" value="Surname is incorrect">
Surname incorrect
</label>

<label class="reason">
<input type="checkbox" value="GSM number is incorrect">
GSM No. incorrect
</label>

<label class="reason">
<input type="checkbox" value="State of origin is incorrect">
State of Origin incorrect
</label>

<label class="reason">
<input type="checkbox" value="Class of degree is incorrect">
Class of Degree incorrect
</label>

<label class="reason">
<input type="checkbox" value="Date of graduation is incorrect">
Graduation Date incorrect
</label>

<label class="reason">
<input type="checkbox" value="Gender is incorrect">
Gender incorrect
</label>

<label class="reason">
<input type="checkbox" value="Marital status is incorrect">
Marital Status incorrect
</label>

<label class="reason">
<input type="checkbox" value="JAMB registration number is incorrect">
JAMB Reg. No. incorrect
</label>

<label class="reason">
<input type="checkbox" value="Course of study is incorrect">
Course of Study incorrect
</label>

<label class="reason">
<input type="checkbox" value="Other information is incorrect">
Other
</label>

</div>


<label>
Additional administrator comment
</label>

<textarea
id="adminComment"
placeholder="Explain what the student needs to correct..."
></textarea>


<div class="action-buttons">

<button
class="approve"
onclick="approve()"
>
✓ APPROVE
</button>

<button
class="reject"
onclick="reject()"
>
× REJECT
</button>

</div>

</div>

</div>


<script>

const GOOGLE_SCRIPT_URL =
"PASTE_YOUR_APPS_SCRIPT_URL_HERE";


/*
==========================================
IMPORTANT

For the first version, enter your
Apps Script URL above.

The admin password is NOT stored in
Google Sheets.

Change this password before use.
==========================================
*/

const ADMIN_PASSWORD =
"CPE26-Admin-2026";


let submissions = [];

let currentSubmission = null;


// ---------------------------------------
// LOAD DATA
// ---------------------------------------

async function loadSubmissions() {

    /*
    The backend endpoint for admin data
    will be added in the next backend
    update.

    For now we prepare the dashboard.
    */

}


// ---------------------------------------
// TABLE
// ---------------------------------------

function renderTable() {

    const body =
        document.getElementById(
            "tableBody"
        );

    const search =
        document.getElementById(
            "search"
        ).value
         .toLowerCase();

    const filter =
        document.getElementById(
            "filter"
        ).value;


    body.innerHTML = "";


    const filtered =
        submissions.filter(
            row => {

                const matchesSearch =
                    (
                        row.submissionID +
                        " " +
                        row.name +
                        " " +
                        row.matricNo
                    )
                    .toLowerCase()
                    .includes(search);


                const matchesStatus =
                    filter === "All" ||
                    row.status === filter;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    filtered.forEach(
        row => {

            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>${escapeHTML(row.submissionID)}</td>

                <td>${escapeHTML(row.name)}</td>

                <td>${escapeHTML(row.matricNo)}</td>

                <td>${escapeHTML(row.courseOfStudy)}</td>

                <td>
                    <span class="status ${escapeHTML(row.status)}">
                        ${escapeHTML(row.status)}
                    </span>
                </td>

                <td>
                    <button
                        class="review-btn"
                        onclick="openReview('${escapeHTML(row.submissionID)}')"
                    >
                        REVIEW
                    </button>
                </td>

            `;


            body.appendChild(tr);

        }
    );

}


// ---------------------------------------
// REVIEW
// ---------------------------------------

function openReview(id) {

    currentSubmission =
        submissions.find(
            row =>
                row.submissionID === id
        );


    if (!currentSubmission) {
        return;
    }


    const details =
        document.getElementById(
            "details"
        );


    details.innerHTML = `

        <div class="detail">
            <small>Submission ID</small>
            <strong>${escapeHTML(currentSubmission.submissionID)}</strong>
        </div>

        <div class="detail">
            <small>Matric No.</small>
            <strong>${escapeHTML(currentSubmission.matricNo)}</strong>
        </div>

        <div class="detail">
            <small>First Name</small>
            <strong>${escapeHTML(currentSubmission.firstName)}</strong>
        </div>

        <div class="detail">
            <small>Middle Name</small>
            <strong>${escapeHTML(currentSubmission.middlename)}</strong>
        </div>

        <div class="detail">
            <small>Surname</small>
            <strong>${escapeHTML(currentSubmission.surname)}</strong>
        </div>

        <div class="detail">
            <small>GSM No.</small>
            <strong>${escapeHTML(currentSubmission.gsmNo)}</strong>
        </div>

        <div class="detail">
            <small>State of Origin</small>
            <strong>${escapeHTML(currentSubmission.stateOfOrigin)}</strong>
        </div>

        <div class="detail">
            <small>Class of Degree</small>
            <strong>${escapeHTML(currentSubmission.classOfDegree)}</strong>
        </div>

        <div class="detail">
            <small>Date of Graduation</small>
            <strong>${escapeHTML(currentSubmission.dateOfGraduation)}</strong>
        </div>

        <div class="detail">
            <small>Gender</small>
            <strong>${escapeHTML(currentSubmission.gender)}</strong>
        </div>

        <div class="detail">
            <small>Marital Status</small>
            <strong>${escapeHTML(currentSubmission.maritalStatus)}</strong>
        </div>

        <div class="detail">
            <small>JAMB Reg. No.</small>
            <strong>${escapeHTML(currentSubmission.jambRegNo)}</strong>
        </div>

        <div class="detail">
            <small>Course</small>
            <strong>${escapeHTML(currentSubmission.courseOfStudy)}</strong>
        </div>

        <div class="detail">
            <small>Current Status</small>
            <strong>${escapeHTML(currentSubmission.status)}</strong>
        </div>

    `;


    document
        .getElementById("modal")
        .style.display = "block";

}


function closeModal() {

    document
        .getElementById("modal")
        .style.display = "none";

}


// ---------------------------------------
// APPROVE
// ---------------------------------------

async function approve() {

    if (!currentSubmission) {
        return;
    }


    if (
        !confirm(
            "Approve this submission?"
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                GOOGLE_SCRIPT_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "approve",

                            submissionID:
                                currentSubmission.submissionID,

                            reviewedBy:
                                "CPE26 Admin"

                        })

                    }
            );


        const result =
            await response.json();


        if (!result.success) {
            throw new Error(
                result.message
            );
        }


        showMessage(
            "Submission approved successfully.",
            true
        );


        closeModal();

        loadSubmissions();

    }

    catch(error) {

        showMessage(
            error.message,
            false
        );

    }

}


// ---------------------------------------
// REJECT
// ---------------------------------------

async function reject() {

    if (!currentSubmission) {
        return;
    }


    const checked =
        [
            ...document
            .querySelectorAll(
                ".reason input:checked"
            )
        ]
        .map(
            checkbox =>
                checkbox.value
        );


    if (checked.length === 0) {

        alert(
            "Please select at least one rejection reason."
        );

        return;

    }


    const comment =
        document
        .getElementById(
            "adminComment"
        )
        .value
        .trim();


    if (
        !confirm(
            "Reject this submission?"
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                GOOGLE_SCRIPT_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "reject",

                            submissionID:
                                currentSubmission.submissionID,

                            rejectionReasons:
                                checked,

                            adminComment:
                                comment,

                            reviewedBy:
                                "CPE26 Admin"

                        })

                }
            );


        const result =
            await response.json();


        if (!result.success) {
            throw new Error(
                result.message
            );
        }


        showMessage(
            "Submission rejected successfully.",
            true
        );


        closeModal();

        loadSubmissions();

    }

    catch(error) {

        showMessage(
            error.message,
            false
        );

    }

}


// ---------------------------------------
// UTILITIES
// ---------------------------------------

function showMessage(
    text,
    success
) {

    const message =
        document
        .getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        success
        ? "message success"
        : "message error";


    setTimeout(
        () => {
            message.style.display =
                "none";
        },
        4000
    );

}


function logout() {

    sessionStorage.removeItem(
        "cpe26_admin"
    );

    location.reload();

}


function escapeHTML(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
