<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIWES IT Placement Information Portal</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b;margin:0;padding:25px 12px}
.container{max-width:850px;margin:auto;background:white;border-radius:12px;overflow:hidden;box-shadow:0 8px 25px #0001}
.header{background:linear-gradient(135deg,#1e3a8a,#0b5ed7);color:white;padding:20px;text-align:center}
nav{margin-top:12px}nav a{color:white;text-decoration:none;margin:0 5px;font-weight:bold}
.form{padding:22px}.title{color:#1e3a8a;margin:18px 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group{margin-bottom:12px}label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px}
textarea{min-height:75px}.btn{width:100%;padding:13px;background:#1e3a8a;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
.msg{display:none;padding:12px;margin-top:12px;border-radius:7px}
.ok{background:#e8f8ef;color:#075b35}.bad{background:#fff0ef;color:#8d2018}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="container">
<header class="header">
<h2>CPE '26 • NYSC Mobilization</h2>
<div>SIWES Placement Portal</div>
<nav>
<a href="index.html">Home</a>
<a href="status.html">Check Status</a>
<a href="nerd.html">NERD</a>
<a href="student-dataform.html">Student Dataform</a>
</nav>
</header>

<div class="form">

<p><b>Important:</b> Fill all information correctly. Bank account must be a valid 10-digit Nigerian account number.</p>

<form id="form">

<h3 class="title">1. Student Information</h3>

<div class="group">
<label>Full Name — Surname First *</label>
<input id="name" required placeholder="e.g. OKONKWO, Emmanuel Chukwuemeka">
</div>

<div class="grid">
<div class="group"><label>Matriculation Number *</label><input id="matric" required></div>
<div class="group"><label>Course of Study *</label><input id="course" required></div>
</div>

<div class="grid">
<div class="group">
<label>Level *</label>
<select id="level" required>
<option value="">Select</option>
<option>300 Level</option><option>400 Level</option><option>500 Level</option>
</select>
</div>

<div class="group">
<label>SIWES Year *</label>
<select id="year" required>
<option value="">Select</option>
<option>2025/2026</option><option>2026/2027</option>
</select>
</div>
</div>

<div class="grid">
<div class="group"><label>Email *</label><input type="email" id="email" required></div>
<div class="group"><label>Phone *</label><input type="tel" id="phone" required></div>
</div>

<div class="group"><label>Nationality *</label><input id="nationality" value="Nigerian" required></div>

<h3 class="title">2. Employer / Placement Information</h3>

<div class="group"><label>Employer / Organization Name *</label><input id="employerName" required></div>

<div class="group">
<label>Employer Office Address *</label>
<textarea id="employerAddress" required></textarea>
</div>

<div class="grid">
<div class="group"><label>Attachment Start Date *</label><input type="date" id="fromDate" required></div>
<div class="group"><label>Attachment End Date *</label><input type="date" id="toDate" required></div>
</div>

<h3 class="title">3. Bank Account Information</h3>

<div class="group">
<label>Bank Name *</label>
<select id="bank" required>
<option value="">Select Bank</option>
<option>Access Bank</option><option>WEMA Bank</option>
<option>Ecobank</option><option>Fidelity Bank</option>
<option>First Bank</option><option>FCMB</option>
<option>GTBank</option><option>Jaiz Bank</option>
<option>Keystone Bank</option><option>Polaris Bank</option>
<option>Stanbic IBTC Bank</option><option>Sterling Bank</option>
<option>Union Bank</option><option>UBA</option>
<option>Unity Bank</option><option>Zenith Bank</option>
<option>Other</option>
</select>
</div>

<div class="grid">
<div class="group"><label>Account Number *</label><input id="accountNumber" maxlength="10" inputmode="numeric" required></div>
<div class="group"><label>Sort / Branch Code *</label><input id="sortCode" maxlength="12" inputmode="numeric" required></div>
</div>

<button class="btn" id="btn">Submit Placement Record</button>
</form>

<div id="msg" class="msg"></div>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyu5ZMcfGyWk7tXGthr6J9B88HV9G3jGGr3hPCtty4grDXQ86BiYETLXDcJ3JZxUOGg/exec";

const $=id=>document.getElementById(id);
const msg=$("msg"),btn=$("btn");

function show(t,c){
 msg.className="msg "+c;
 msg.innerHTML=t;
 msg.style.display="block";
}

$("form").onsubmit=async e=>{
 e.preventDefault();
 msg.style.display="none";

 let account=$("accountNumber").value.trim();
 let sort=$("sortCode").value.trim();
 let from=$("fromDate").value;
 let to=$("toDate").value;

 if(!/^\d{10}$/.test(account))
   return show("Account number must contain exactly 10 digits.","bad");

 if(!/^\d{3,12}$/.test(sort))
   return show("Sort/Branch code must contain 3–12 digits.","bad");

 if(from>to)
   return show("Start date cannot be later than end date.","bad");

 if(!confirm("Please confirm that all information entered is correct."))return;

 let data={
  action:"itSubmit",
  Name:$("name").value.trim(),
  MatricNo:$("matric").value.trim(),
  Course:$("course").value.trim(),
  Level:$("level").value,
  SIWESYear:$("year").value,
  StudentEmail:$("email").value.trim(),
  Phone:$("phone").value.trim(),
  Nationality:$("nationality").value.trim(),
  EmployerName:$("employerName").value.trim(),
  EmployerAddress:$("employerAddress").value.trim(),
  FromDate:from,
  ToDate:to,
  Bank:$("bank").value,
  AccountNumber:account,
  SortCode:sort
 };

 btn.disabled=true;
 btn.textContent="Submitting...";

 try{
  let r=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify(data)
  });

  let x=await r.json();

  if(!x.success)throw Error(x.message);

  show("✔ Submitted successfully.<br><b>Submission ID: "+
   x.submissionID+"</b><br><br><a href='status.html'>Check Status →</a>","ok");

  $("form").reset();

 }catch(err){
  show("Unable to submit: "+err.message,"bad");
 }finally{
  btn.disabled=false;
  btn.textContent="Submit Placement Record";
 }
};
</script>

</body>
</html>
