<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Check Status | CPE '26</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050b14;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ================= HEADER ================= */

    header {
      width: 100%;
      border-bottom: 1px solid rgba(0, 229, 255, 0.15);
      background: rgba(5, 11, 20, 0.96);
    }

    .header-inner {
      max-width: 1150px;
      margin: auto;
      padding: 20px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: #00e5ff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      color: #aab8c7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
    }

    nav a:hover {
      color: #00e5ff;
    }

    nav a.active {
      color: #00e5ff;
    }

    /* ================= MAIN ================= */

    main {
      min-height: calc(100vh - 145px);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 70px 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .heading .small-title {
      color: #00e5ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .heading h1 {
      font-size: clamp(35px, 7vw, 55px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .heading h1 span {
      color: #00e5ff;
    }

    .heading p {
      margin-top: 16px;
      color: #7f91a3;
      font-size: 13px;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    /* ================= CARD ================= */

    .card {
      background: #08111d;
      border: 1px solid #162a3a;
      border-radius: 18px;
      padding: 32px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        0 0 40px rgba(0, 229, 255, 0.03);
    }

    .form-title {
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    /* ================= FORM ================= */

    .status-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-form label {
      color: #8da0b2;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .status-form input {
      width: 100%;
      height: 54px;

      padding: 0 16px;

      background: #050b14;
      border: 1px solid #20394c;
      border-radius: 10px;

      color: #ffffff;
      font-size: 15px;
      font-weight: 600;

      outline: none;
      transition: 0.2s;
    }

    .status-form input::placeholder {
      color: #536779;
    }

    .status-form input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.08);
    }

    /* ================= BUTTON ================= */

    .status-form button {
      width: 100%;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 10px;

      background: #00e5ff;
      color: #001018;

      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.8px;

      cursor: pointer;

      visibility: visible;
      opacity: 1;

      transition:
        transform 0.2s,
        box-shadow 0.2s,
        opacity 0.2s;
    }

    .status-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 229, 255, 0.2);
    }

    .status-form button:active {
      transform: translateY(0);
    }

    .status-form button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    /* ================= ERROR ================= */

    #error {
      display: none;

      margin-top: 18px;
      padding: 14px 16px;

      background: rgba(255, 75, 75, 0.08);
      border: 1px solid rgba(255, 75, 75, 0.3);
      border-radius: 10px;

      color: #ff8585;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ================= RESULT ================= */

    #result {
      display: none;
      margin-top: 25px;
    }

    .result-box {
      border: 1px solid #20394c;
      border-radius: 14px;
      overflow: hidden;
      background: #050b14;
    }

    .result-header {
      padding: 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;

      border-bottom: 1px solid #172b3b;
    }

    .result-header h2 {
      font-size: 15px;
      font-weight: 800;
    }

    .status-badge {
      padding: 7px 12px;
      border-radius: 30px;

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-pending {
      color: #ffd166;
      background: rgba(255, 209, 102, 0.1);
      border: 1px solid rgba(255, 209, 102, 0.25);
    }

    .status-approved {
      color: #55efc4;
      background: rgba(85, 239, 196, 0.1);
      border: 1px solid rgba(85, 239, 196, 0.25);
    }

    .status-rejected {
      color: #ff7675;
      background: rgba(255, 118, 117, 0.1);
      border: 1px solid rgba(255, 118, 117, 0.25);
    }

    .status-unknown {
      color: #b8c5d0;
      background: rgba(184, 197, 208, 0.08);
      border: 1px solid rgba(184, 197, 208, 0.2);
    }

    .details {
      padding: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      padding: 13px 0;
      border-bottom: 1px solid #10202e;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #718496;
      font-size: 12px;
    }

    .detail-value {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }

    .message-box {
      margin-top: 18px;
      padding: 16px;

      border-radius: 10px;
      background: #08111d;
      border: 1px solid #172b3b;
    }

    .message-box strong {
      display: block;
      margin-bottom: 8px;

      color: #00e5ff;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .message-box p {
      color: #b5c2ce;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ================= FOOTER ================= */

    footer {
      text-align: center;
      padding: 25px 20px;

      color: #526576;
      font-size: 11px;

      border-top: 1px solid rgba(0, 229, 255, 0.08);
    }

    footer span {
      color: #00e5ff;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      .header-inner {
        padding: 17px 18px;
      }

      .logo {
        font-size: 18px;
      }

      nav {
        gap: 13px;
      }

      nav a {
        font-size: 11px;
      }

      main {
        padding: 50px 15px;
        align-items: flex-start;
      }

      .heading {
        margin-top: 15px;
      }

      .heading h1 {
        font-size: 38px;
      }

      .heading p {
        font-size: 11px;
      }

      .card {
        padding: 22px;
        border-radius: 14px;
      }

      .result-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .detail-row {
        flex-direction: column;
        gap: 6px;
      }

      .detail-value {
        text-align: left;
      }
    }

    @media (max-width: 450px) {

      nav a:nth-child(1) {
        display: none;
      }

      .header-inner {
        justify-content: space-between;
      }

      nav {
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>
    <div class="header-inner">

      <div class="logo">
        &lt; CPE_26 /&gt;
      </div>

      <nav>
        <a href="index.html">Home</a>
        <a href="nerd.html">N-E-R-D</a>
        <a href="dataform.html">Student Dataform</a>
        <a href="status.html" class="active">Status</a>
      </nav>

    </div>
  </header>


  <!-- ================= MAIN ================= -->

  <main>

    <div class="container">

      <div class="heading">

        <div class="small-title">
          Student Portal
        </div>

        <h1>
          CHECK <span>STATUS</span>
        </h1>

        <p>
          STUDENT IT / SIWES • COMPUTER ENGINEERING CLASS OF 2026
        </p>

      </div>


      <!-- ================= CARD ================= -->

      <div class="card">

        <div class="form-title">
          Track Your Submission
        </div>


        <!-- ================= STATUS FORM ================= -->

        <div class="status-form">

          <label for="submissionID">
            ENTER YOUR SUBMISSION ID
          </label>

          <input
            type="text"
            id="submissionID"
            placeholder="IT-2026-00001"
            autocomplete="off"
            spellcheck="false"
          >

          <!-- THIS IS THE CHECK STATUS BUTTON -->

          <button
            type="button"
            id="checkButton"
            onclick="checkStatus()"
          >
            CHECK STATUS →
          </button>

        </div>


        <!-- ================= ERROR ================= -->

        <div id="error"></div>


        <!-- ================= RESULT ================= -->

        <div id="result"></div>

      </div>

    </div>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer>
    CPE '26 Student Portal &nbsp;•&nbsp;
    <span>Computer Engineering</span>
  </footer>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    /* YOUR WORKING GOOGLE APPS SCRIPT API */

    const API =
      "https://script.google.com/macros/s/AKfycbyu5ZMcfGyWk7tXGthr6J9B88HV9G3jGGr3hPCtty4grDXQ86BiYETLXDcJ3JZxUOGg/exec";


    const input =
      document.getElementById("submissionID");

    const button =
      document.getElementById("checkButton");

    const errorBox =
      document.getElementById("error");

    const result =
      document.getElementById("result");


    /*
      Allow Enter key to check status
    */

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        checkStatus();
      }

    });


    /*
      CHECK STATUS
    */

    async function checkStatus() {

      const id =
        input.value.trim();


      /* No ID */

      if (!id) {

        showError(
          "Please enter your Submission ID."
        );

        input.focus();

        return;
      }


      /* Start loading */

      button.disabled = true;

      button.textContent =
        "CHECKING...";

      errorBox.style.display =
        "none";

      result.style.display =
        "none";


      try {

        /*
          Build API request
        */

        const requestURL =
          API +
          "?action=itStatus&id=" +
          encodeURIComponent(id) +
          "&t=" +
          Date.now();


        console.log(
          "Checking:",
          requestURL
        );


        /*
          Send request to Google Apps Script
        */

        const response =
          await fetch(
            requestURL,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        /*
          Check HTTP response
        */

        if (!response.ok) {

          throw new Error(
            "Server returned HTTP " +
            response.status
          );

        }


        /*
          Convert response to JSON
        */

        const data =
          await response.json();


        console.log(
          "API Response:",
          data
        );


        /*
          Backend says unsuccessful
        */

        if (!data.success) {

          throw new Error(
            data.message ||
            "Submission ID was not found."
          );

        }


        /*
          Display result
        */

        showResult(data);


      } catch (error) {

        console.error(
          "Status Error:",
          error
        );


        showError(
          error.message ||
          "Unable to connect to the backend."
        );


      } finally {

        /*
          Stop loading
        */

        button.disabled = false;

        button.textContent =
          "CHECK STATUS →";

      }

    }


    /*
      SHOW STATUS RESULT
    */

    function showResult(data) {

      const status =
        String(
          data.status || "Unknown"
        );


      const normalizedStatus =
        status.toLowerCase();


      let statusClass =
        "status-unknown";


      if (
        normalizedStatus ===
        "pending"
      ) {

        statusClass =
          "status-pending";

      }

      else if (
        normalizedStatus ===
        "approved"
      ) {

        statusClass =
          "status-approved";

      }

      else if (
        normalizedStatus ===
        "rejected"
      ) {

        statusClass =
          "status-rejected";

      }


      let html = `

        <div class="result-box">

          <div class="result-header">

            <h2>
              Submission Status
            </h2>

            <span class="status-badge ${statusClass}">
              ${escapeHTML(status)}
            </span>

          </div>


          <div class="details">

            <div class="detail-row">

              <div class="detail-label">
                Submission ID
              </div>

              <div class="detail-value">
                ${escapeHTML(
                  data.submissionID || "-"
                )}
              </div>

            </div>


            <div class="detail-row">

              <div class="detail-label">
                Current Status
              </div>

              <div class="detail-value">
                ${escapeHTML(status)}
              </div>

            </div>

      `;


      /*
        Rejection reason
      */

      if (data.rejectionReason) {

        html += `

          <div class="message-box">

            <strong>
              Rejection Reason
            </strong>

            <p>
              ${escapeHTML(
                data.rejectionReason
              )}
            </p>

          </div>

        `;

      }


      /*
        Admin comment
      */

      if (data.adminComment) {

        html += `

          <div class="message-box">

            <strong>
              Admin Comment
            </strong>

            <p>
              ${escapeHTML(
                data.adminComment
              )}
            </p>

          </div>

        `;

      }


      /*
        Reviewed by
      */

      if (data.reviewedBy) {

        html += `

          <div class="detail-row">

            <div class="detail-label">
              Reviewed By
            </div>

            <div class="detail-value">
              ${escapeHTML(
                data.reviewedBy
              )}
            </div>

          </div>

        `;

      }


      /*
        Review date
      */

      if (data.reviewDate) {

        html += `

          <div class="detail-row">

            <div class="detail-label">
              Review Date
            </div>

            <div class="detail-value">
              ${formatDate(
                data.reviewDate
              )}
            </div>

          </div>

        `;

      }


      /*
        Close HTML
      */

      html += `

          </div>

        </div>

      `;


      result.innerHTML =
        html;

      result.style.display =
        "block";


      /*
        Scroll result into view
      */

      result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

    }


    /*
      SHOW ERROR
    */

    function showError(message) {

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";

      result.style.display =
        "none";

    }


    /*
      FORMAT DATE
    */

    function formatDate(value) {

      if (!value) {
        return "-";
      }


      try {

        const date =
          new Date(value);


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {

          return escapeHTML(
            String(value)
          );

        }


        return date.toLocaleString(
          "en-NG",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        );

      } catch (error) {

        return escapeHTML(
          String(value)
        );

      }

    }


    /*
      SECURITY:
      Prevent HTML injection
    */

    function escapeHTML(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
</html>
